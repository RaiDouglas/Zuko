<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - F1 NEWS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="img/F1-Emblem.png" alt="Logo F1">
            <h1>F1 NEWS</h1>
        </div>

        <button class="botao-menu" id="botao-menu">

            <svg xmlns="http://www.w3.org/2000/svg"
                width="30"
                height="30"
                fill="currentColor"
                class="bi bi-list"
                viewBox="0 0 16 16">

                <path fill-rule="evenodd"
                    d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>

            </svg>

        </button>

        <div class="menu-op" id="menu-op">

            <a href="login.html">Login</a>
            <a href="cadastro.html">Criar conta</a>
            <a href="perfil.html">Meu perfil</a>
            <a href="confige.html">Configurações</a>

        </div>

    </header>

    <nav>
        <a href="F1news.html">INÍCIO</a>
        <a href="#">NOTÍCIAS</a>
        <a href="#">CALENDÁRIO</a>
        <a href="#">CLASSIFICAÇÃO</a>
        <a href="#">EQUIPES</a>
        <a href="#">PILOTOS</a>
    </nav>

    <main class="criar-conta">

        <div class="caixa-conta">

            <h2>Criar conta</h2>

            <p>Crie sua conta para acompanhar as notícias da F1.</p>

            <form>

                <label for="nome">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha"
                    required
                >

                <label for="confirmar">Confirmar senha</label>
                <input 
                    type="password" 
                    id="confirmar" 
                    placeholder="Digite a senha novamente"
                    required
                >

                <button type="submit">CRIAR CONTA</button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="login.html">Fazer login</a>
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
