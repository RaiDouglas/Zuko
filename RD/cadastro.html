<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - F1 NEWS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="img/F1-Emblem.png" alt="Logo F1">
            <h1>F1 NEWS</h1>
        </div>

    </header>

    <main class="criar-conta">

        <div class="caixa-conta">

            <h2>Criar conta</h2>

            <p>Crie sua conta para acompanhar as notícias da F1.</p>

            <form>

                <label for="nome">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha"
                    required
                >

                <label for="confirmar">Confirmar senha</label>
                <input 
                    type="password" 
                    id="confirmar" 
                    placeholder="Digite a senha novamente"
                    required
                >

                <button type="submit">CRIAR CONTA</button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="#">Fazer login</a>
            </p>

        </div>

    </main>

</body>

</html>
